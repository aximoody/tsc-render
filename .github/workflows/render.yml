name: render-short

# Make fires this via the GitHub API (repository_dispatch, event_type: render_video)
# with a client_payload describing the video. See build_job.py for the shape.
on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch: {}   # lets you run a manual test from the Actions tab

permissions:
  contents: write   # needed to publish the rendered mp4 as a release asset

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build job from payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python3 build_job.py

      - name: Voiceover (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python3 tts.py job.json

      - name: Render
        run: python3 render.py job.json out.mp4

      - name: Publish as release asset
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out.mp4 job.json \
            --title "$TAG" \
            --notes "Automated render for: $(jq -r .title job.json)"
          URL=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="out.mp4") | .url')
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notify Make (video ready)
        if: ${{ github.event.client_payload.callback_url != '' }}
        env:
          CALLBACK: ${{ github.event.client_payload.callback_url }}
          VIDEO_URL: ${{ steps.publish.outputs.video_url }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          jq -n \
            --arg video_url "$VIDEO_URL" \
            --arg title "$(echo "$PAYLOAD" | jq -r .title)" \
            --arg caption "$(echo "$PAYLOAD" | jq -r '.caption // ""')" \
            --arg hashtags "$(echo "$PAYLOAD" | jq -r '.hashtags // ""')" \
            '{video_url:$video_url, title:$title, caption:$caption, hashtags:$hashtags}' \
          | curl -sS -X POST -H "Content-Type: application/json" -d @- "$CALLBACK"
